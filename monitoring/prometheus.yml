global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── Logging service ─────────────────────────────────────────────────────────
  # Running natively on the host. Reachable from Docker via host.docker.internal.
  # Exposes all 6 Phase-5 GAP-07 SDK metrics on :9090/metrics.
  - job_name: "logging-service"
    static_configs:
      - targets: ["host.docker.internal:9090", "wallet_logging_service:9090", "logging-service:9090"]
    metrics_path: /metrics

  # ── RabbitMQ ─────────────────────────────────────────────────────────────────
  # Running in Docker — use container name directly.
  # Served natively by the rabbitmq_prometheus plugin (enabled_plugins).
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["wallet_rabbitmq:15692"]
    metrics_path: /metrics

  # ── Prometheus self-monitoring ────────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── API Gateway ───────────────────────────────────────────────────────────────
  # Scrape the API Gateway running natively on the host port 8080.
  - job_name: "api-gateway"
    static_configs:
      - targets: ["host.docker.internal:8080"]
    metrics_path: /metrics

  # ── Wallet Primary Service (Active) ───────────────────────────────────────────
  # Scrape wallet-primary management HTTP server on port 9094 (Phase 3 / GAP-OBS-02).
  - job_name: "wallet-primary"
    static_configs:
      - targets: ["host.docker.internal:9094", "wallet_primary_active:9094"]
    metrics_path: /metrics

  # ── Wallet Standby Service (Hot DR) ───────────────────────────────────────────
  # Scrape wallet-standby management HTTP server on port 9093 (Phase 3 / GAP-OBS-02).
  - job_name: "wallet-standby"
    static_configs:
      - targets: ["host.docker.internal:9093", "wallet_standby_hot_dr:9093"]
    metrics_path: /metrics

  # ── Ledger Service ────────────────────────────────────────────────────────────
  # Scrape ledger-service management HTTP server on port 9092 (Phase 3 / GAP-OBS-02).
  - job_name: "ledger-service"
    static_configs:
      - targets: ["host.docker.internal:9092", "wallet_ledger_service:9092"]
    metrics_path: /metrics

