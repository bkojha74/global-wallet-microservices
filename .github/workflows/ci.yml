name: Go CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Go protobuf plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate protobuf Go files
        run: |
          protoc --version
          protoc --go_out=. --go_opt=paths=source_relative \
            --go-grpc_out=. --go-grpc_opt=paths=source_relative \
            proto/wallet/wallet.proto \
            proto/ledger/ledger.proto \
            proto/auth/auth.proto

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./... -count=1

      - name: Run race detector
        run: go test -race ./... -count=1

  docker-publish:
    name: Build & Push to Docker Hub
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: wallet-api-gateway
            target: api-gateway
          - name: wallet-service
            target: wallet-service
          - name: wallet-ledger-service
            target: ledger-service
          - name: wallet-auth-service
            target: auth-service
          - name: wallet-logging-service
            target: logging-service
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.service.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Local Server
    needs: docker-publish
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Windows]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest microservice images
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose -f docker-compose.mongodb.yml pull
          docker compose -f docker-compose.rabbitmq.yml pull
          docker compose -f docker-compose.auth.yml pull
          docker compose -f docker-compose.logging.yml pull
          docker compose -f docker-compose.yml pull

      - name: Start or update services
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # 1. Ensure shared network exists
          docker network inspect wallet_shared_net 2>$null
          if ($LASTEXITCODE -ne 0) {
            docker network create wallet_shared_net
          }
          
          # 2. Ensure MongoDB volume exists
          docker volume inspect global-wallet-microservices_mongo_data 2>$null
          if ($LASTEXITCODE -ne 0) {
            docker volume create global-wallet-microservices_mongo_data
          }

          # 3. Start supporting infrastructure
          docker compose -f docker-compose.mongodb.yml up -d
          docker compose -f docker-compose.rabbitmq.yml up -d
          docker compose -f docker-compose.auth.yml up -d
          docker compose -f docker-compose.logging.yml up -d

          # 4. Start microservices with latest images
          docker compose -f docker-compose.yml up -d

      - name: Verify Running Services
        shell: powershell
        run: |
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
