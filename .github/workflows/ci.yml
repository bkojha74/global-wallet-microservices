name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/*']
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'SECURITY.md'
      - '.gitignore'
      - 'postman/**'
  pull_request:
    branches: [main, develop, 'feature/*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'SECURITY.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment Target on Local Runner'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - kubernetes
          - docker-compose
          - none

permissions:
  contents: read
  security-events: write

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1: Environment Setup, Protobuf Contract & Build Verification
  # ═══════════════════════════════════════════════════════════════════════════
  env-setup-check:
    name: Environment & Proto Setup Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Verify Go Module Integrity
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Install protobuf compiler & plugins
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate protobuf Go files
        run: |
          protoc --go_out=. --go_opt=paths=source_relative \
            --go-grpc_out=. --go-grpc_opt=paths=source_relative \
            proto/wallet/wallet.proto \
            proto/ledger/ledger.proto \
            proto/auth/auth.proto \
            proto/fx/fx.proto

      - name: Verify Binaries Buildability
        run: go build ./cmd/...

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 2: Coding Standards & Linting (Parallel)
  # ═══════════════════════════════════════════════════════════════════════════
  coding-standards:
    name: Coding Standards (gofmt & golangci-lint)
    needs: env-setup-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install protobuf compiler & plugins
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate protobuf Go files
        run: |
          protoc --go_out=. --go_opt=paths=source_relative \
            --go-grpc_out=. --go-grpc_opt=paths=source_relative \
            proto/wallet/wallet.proto \
            proto/ledger/ledger.proto \
            proto/auth/auth.proto \
            proto/fx/fx.proto

      - name: Check Go Formatting
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Files not formatted according to gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run Go Vet Static Analysis
        run: go vet ./cmd/... ./pkg/...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 3: Security & Code Quality Gate / SAST (Parallel)
  # ═══════════════════════════════════════════════════════════════════════════
  security-quality-sast:
    name: SAST & Security Analysis (SonarQube / Fortify / govulncheck)
    needs: env-setup-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install protobuf compiler & plugins
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate protobuf Go files
        run: |
          protoc --go_out=. --go_opt=paths=source_relative \
            --go-grpc_out=. --go-grpc_opt=paths=source_relative \
            proto/wallet/wallet.proto \
            proto/ledger/ledger.proto \
            proto/auth/auth.proto \
            proto/fx/fx.proto

      - name: Dependency Vulnerability Scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run GoSec Security Linter (OWASP/CWE Analysis)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-generated -severity medium ./cmd/... ./pkg/...

      - name: SonarQube / SonarCloud Scanner
        if: env.SONAR_TOKEN != ''
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Status Notice
        if: env.SONAR_TOKEN == ''
        run: |
          echo "Notice: SONAR_TOKEN secret not present in repository secrets. Skipping remote SonarQube Quality Gate analysis."

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 4: Unit Testing & Race Detection (Parallel)
  # ═══════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: Unit Tests & Race Detection
    needs: env-setup-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install protobuf compiler & plugins
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate protobuf Go files
        run: |
          protoc --go_out=. --go_opt=paths=source_relative \
            --go-grpc_out=. --go-grpc_opt=paths=source_relative \
            proto/wallet/wallet.proto \
            proto/ledger/ledger.proto \
            proto/auth/auth.proto \
            proto/fx/fx.proto

      - name: Run Unit Tests with Race Detector & Coverage
        run: |
          go test -race -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 5: Integration Testing (Live Backing Services)
  # ═══════════════════════════════════════════════════════════════════════════
  integration-tests:
    name: Integration Testing (Keycloak & Backing Services)
    needs: [coding-standards, security-quality-sast, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install protobuf compiler & plugins
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          protoc --go_out=. --go_opt=paths=source_relative \
            --go-grpc_out=. --go-grpc_opt=paths=source_relative \
            proto/wallet/wallet.proto proto/ledger/ledger.proto proto/auth/auth.proto proto/fx/fx.proto

      - name: Start Ephemeral Keycloak Container
        run: |
          docker network create wallet_shared_net || true
          docker run -d --name keycloak-ci --network wallet_shared_net \
            -p 8085:8080 \
            -e KEYCLOAK_ADMIN=admin \
            -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -v ${{ github.workspace }}/deploy/keycloak/wallet-realm-realm.json:/opt/keycloak/data/import/wallet-realm-realm.json \
            quay.io/keycloak/keycloak:24.0.1 start-dev --import-realm

      - name: Wait for Keycloak Readiness
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8085/realms/wallet-realm/.well-known/openid-configuration | grep -q "issuer"; then
              echo "Keycloak is ready!"
              exit 0
            fi
            echo "Waiting for Keycloak... ($i/30)"
            sleep 2
          done
          echo "Keycloak readiness timed out"
          docker logs keycloak-ci --tail=50
          exit 1

      - name: Run Keycloak OIDC & RBAC Integration Tests
        env:
          KEYCLOAK_TEST_HOST: http://localhost:8085
        run: go test -v -run TestKeycloakIntegration ./cmd/auth-service

      - name: Teardown Keycloak
        if: always()
        run: docker rm -f keycloak-ci || true

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 6: System & E2E Testing
  # ═══════════════════════════════════════════════════════════════════════════
  system-e2e-tests:
    name: System & E2E Testing
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Networks & Volumes
        run: |
          docker network inspect wallet_shared_net >/dev/null 2>&1 || docker network create wallet_shared_net
          docker volume inspect wallet_rabbitmq_data >/dev/null 2>&1 || docker volume create wallet_rabbitmq_data
          docker volume inspect wallet_rabbitmq_data_2 >/dev/null 2>&1 || docker volume create wallet_rabbitmq_data_2
          docker volume inspect wallet_rabbitmq_data_3 >/dev/null 2>&1 || docker volume create wallet_rabbitmq_data_3

      - name: Build and Spin Up Full System Stack
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          AI_FRAUD_THRESHOLD: 0.6
        run: |
          docker compose -f docker-compose.mongodb.yml up -d
          docker compose -f docker-compose.rabbitmq.yml up -d
          docker compose -f docker-compose.auth.yml up --build -d
          docker compose -f docker-compose.fx.yml up --build -d
          docker compose -f docker-compose.logging.yml up --build -d
          docker compose -f docker-compose.yml up --build -d

      - name: Verify MongoDB 3-Node Replica Set Health
        run: |
          echo "Verifying MongoDB 3-node replica set status..."
          docker exec wallet_mongodb_1 mongosh --port 27018 --quiet --eval "rs.status().members.map(m => ({id: m._id, name: m.name, stateStr: m.stateStr, health: m.health}))"

      - name: Wait for API Gateway Readiness
        run: |
          for i in {1..35}; do
            if curl -s http://localhost:8080/api/v1/cluster/status | grep -q "current_routed_target"; then
              echo "API Gateway and cluster are operational!"
              exit 0
            fi
            echo "Waiting for API Gateway cluster... ($i/35)"
            sleep 3
          done
          echo "Cluster readiness timeout"
          docker compose -f docker-compose.yml logs --tail=50
          exit 1

      - name: Run E2E Test Suite (9 ACID Transfer & Failover Scenarios)
        run: |
          chmod +x scripts/test-e2e.sh
          ./scripts/test-e2e.sh

      - name: Dump Logs on Failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml logs --tail=100
          docker compose -f docker-compose.auth.yml logs --tail=50
          docker compose -f docker-compose.logging.yml logs --tail=50

      - name: Teardown System Stack
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v || true
          docker compose -f docker-compose.logging.yml down -v || true
          docker compose -f docker-compose.fx.yml down -v || true
          docker compose -f docker-compose.auth.yml down -v || true
          docker compose -f docker-compose.rabbitmq.yml down -v || true
          docker compose -f docker-compose.mongodb.yml down -v || true

  # Required status check for GitHub Branch Protection rules expecting 'Test'
  test:
    name: test
    needs: [env-setup-check, coding-standards, security-quality-sast, unit-tests, integration-tests, system-e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Report Test Status
        run: |
          echo "All required test suites, code quality checks, SAST scans, and integration tests passed successfully!"

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 7: Container Build, Security Scan (Trivy) & Push to Registry
  # ═══════════════════════════════════════════════════════════════════════════
  docker-publish:
    name: Build, Scan & Push to Docker Hub
    needs: system-e2e-tests
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/'))) || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: wallet-api-gateway
            target: api-gateway
          - name: wallet-service
            target: wallet-service
          - name: wallet-ledger-service
            target: ledger-service
          - name: wallet-auth-service
            target: auth-service
          - name: wallet-fx-service
            target: fx-service
          - name: wallet-logging-service
            target: logging-service
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker Image Repository (Dev vs Prod)
        id: repo
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            echo "repo_name=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}" >> "$GITHUB_OUTPUT"
            echo "is_prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "repo_name=${{ secrets.DOCKERHUB_USERNAME }}/dev-${{ matrix.service.name }}" >> "$GITHUB_OUTPUT"
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.repo_name }}
          tags: |
            type=raw,value=latest,enable=${{ steps.repo.outputs.is_prod == 'true' }}
            type=raw,value=dev-latest,enable=${{ steps.repo.outputs.is_prod == 'false' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build Docker Image locally for Scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.service.target }}
          load: true
          tags: ${{ matrix.service.name }}:scan
          cache-from: type=gha

      - name: Run Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.service.name }}:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.service.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 8A: Deploy to Target / Local Docker Compose
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-compose:
    name: Deploy to Local Docker Compose
    needs: docker-publish
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/'))) || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'docker-compose' || github.event.inputs.deploy_target == ''))
    runs-on: [self-hosted, Windows]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Docker Daemon Readiness
        id: docker_check
        shell: cmd
        continue-on-error: true
        run: |
          echo Checking Docker daemon status...
          docker info
          if errorlevel 1 (
            echo.
            echo Checking docker version...
            docker version
            echo ::warning::Docker daemon is not running or accessible on this Windows runner context. Skipping local deployment.
            echo DOCKER_READY=false>> "%GITHUB_ENV%"
          ) else (
            echo.
            echo Docker daemon is running and accessible.
            echo DOCKER_READY=true>> "%GITHUB_ENV%"
          )
          exit /b 0

      - name: Log in to Docker Hub
        if: env.DOCKER_READY == 'true'
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest microservice images
        if: env.DOCKER_READY == 'true'
        shell: cmd
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose -f docker-compose.mongodb.yml pull
          docker compose -f docker-compose.rabbitmq.yml pull
          docker compose -f docker-compose.auth.yml pull
          docker compose -f docker-compose.fx.yml pull
          docker compose -f docker-compose.logging.yml pull
          docker compose -f docker-compose.yml pull

      - name: Start or update services
        if: env.DOCKER_READY == 'true'
        shell: cmd
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker network inspect wallet_shared_net >nul 2>&1 || docker network create wallet_shared_net
          docker volume inspect global-wallet-microservices_mongo_data >nul 2>&1 || docker volume create global-wallet-microservices_mongo_data
          docker volume inspect wallet_rabbitmq_data >nul 2>&1 || docker volume create wallet_rabbitmq_data
          docker volume inspect wallet_rabbitmq_data_2 >nul 2>&1 || docker volume create wallet_rabbitmq_data_2
          docker volume inspect wallet_rabbitmq_data_3 >nul 2>&1 || docker volume create wallet_rabbitmq_data_3
          docker compose -f docker-compose.mongodb.yml up -d
          docker compose -f docker-compose.rabbitmq.yml up -d
          docker compose -f docker-compose.auth.yml up -d
          docker compose -f docker-compose.fx.yml up -d
          docker compose -f docker-compose.logging.yml up -d
          docker compose -f docker-compose.yml up -d

      - name: Verify Running Compose Containers
        if: env.DOCKER_READY == 'true'
        shell: cmd
        continue-on-error: true
        run: |
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 8B: Deploy to Target / Local Kubernetes Cluster
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-k8s:
    name: Deploy to Local Kubernetes Cluster
    needs: docker-publish
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/'))) || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'kubernetes' || github.event.inputs.deploy_target == ''))
    runs-on: [self-hosted, Windows]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Kubernetes Cluster Readiness
        id: k8s_check
        shell: cmd
        continue-on-error: true
        run: |
          echo Checking Kubernetes cluster connectivity...
          kubectl cluster-info
          if errorlevel 1 (
            echo.
            echo ::warning::Kubernetes cluster is not running or accessible on this Windows runner.
            echo Please ensure Docker Desktop Kubernetes (Settings -^> Kubernetes -^> Enable) or Minikube is started.
            echo K8S_READY=false>> "%GITHUB_ENV%"
          ) else (
            echo.
            echo Kubernetes cluster is active and reachable!
            kubectl get nodes
            echo K8S_READY=true>> "%GITHUB_ENV%"
          )
          exit /b 0

      - name: Prepare Microservice Images for Kubernetes
        if: env.K8S_READY == 'true'
        shell: cmd
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set DOCKER_USER=%DOCKERHUB_USERNAME%
          if "%DOCKER_USER%"=="" set DOCKER_USER=bkojha74

          echo Tagging microservice container images for local Kubernetes cluster...
          docker tag %DOCKER_USER%/wallet-api-gateway:latest wallet-system/api-gateway:latest 2>nul
          docker tag %DOCKER_USER%/wallet-service:latest wallet-system/wallet-service:latest 2>nul
          docker tag %DOCKER_USER%/wallet-ledger-service:latest wallet-system/ledger-service:latest 2>nul
          docker tag %DOCKER_USER%/wallet-auth-service:latest wallet-system/auth-service:latest 2>nul
          docker tag %DOCKER_USER%/wallet-fx-service:latest wallet-system/fx-service:latest 2>nul
          docker tag %DOCKER_USER%/wallet-logging-service:latest wallet-system/logging-service:latest 2>nul
          exit /b 0

      - name: Deploy Kubernetes Suite (k8s/)
        if: env.K8S_READY == 'true'
        shell: cmd
        continue-on-error: true
        run: |
          echo Applying Kubernetes Namespace and Secrets...
          kubectl apply -f k8s/01-namespace.yaml
          kubectl apply -f k8s/09-configmap-secrets.yaml

          echo Applying Infrastructure (MongoDB StatefulSet and RabbitMQ)...
          kubectl apply -f k8s/02-mongodb.yaml
          kubectl apply -f k8s/06-rabbitmq.yaml

          echo Applying Microservices (Ledger, Auth, FX, Wallet, Logging, Gateway)...
          kubectl apply -f k8s/03-ledger-service.yaml
          kubectl apply -f k8s/11-auth-service.yaml
          kubectl apply -f k8s/12-fx-service.yaml
          kubectl apply -f k8s/04-wallet-services.yaml
          kubectl apply -f k8s/07-logging-service.yaml
          kubectl apply -f k8s/05-api-gateway.yaml

          echo Applying Ingress, Autoscaling and Disruption Budgets...
          kubectl apply -f k8s/08-ingress.yaml
          kubectl apply -f k8s/10-hpa-pdb.yaml

      - name: Trigger Rolling Update on Deployments
        if: env.K8S_READY == 'true'
        shell: cmd
        continue-on-error: true
        run: |
          echo Triggering rolling update across microservices...
          kubectl rollout restart deployment/api-gateway -n banking-system 2>nul
          kubectl rollout restart deployment/wallet-primary -n banking-system 2>nul
          kubectl rollout restart deployment/wallet-standby -n banking-system 2>nul
          kubectl rollout restart deployment/ledger-service -n banking-system 2>nul
          kubectl rollout restart deployment/auth-service -n banking-system 2>nul
          kubectl rollout restart deployment/fx-service -n banking-system 2>nul
          kubectl rollout restart deployment/logging-service -n banking-system 2>nul
          exit /b 0

      - name: Verify Rollout Status
        if: env.K8S_READY == 'true'
        shell: cmd
        continue-on-error: true
        run: |
          echo Awaiting rollout completion (timeout: 120s per service)...
          kubectl rollout status deployment/api-gateway -n banking-system --timeout=120s
          kubectl rollout status deployment/wallet-primary -n banking-system --timeout=120s
          kubectl rollout status deployment/ledger-service -n banking-system --timeout=120s
          kubectl rollout status deployment/auth-service -n banking-system --timeout=120s
          kubectl rollout status deployment/fx-service -n banking-system --timeout=120s
          kubectl rollout status deployment/logging-service -n banking-system --timeout=120s
          exit /b 0

      - name: Inspect Active Kubernetes Workloads
        if: env.K8S_READY == 'true'
        shell: cmd
        continue-on-error: true
        run: |
          echo ========================================================
          echo  Active Pods in banking-system
          echo ========================================================
          kubectl get pods -n banking-system -o wide
          echo.
          echo ========================================================
          echo  Active Services in banking-system
          echo ========================================================
          kubectl get svc -n banking-system
          echo.
          echo ========================================================
          echo  Active Ingress and Autoscalers (HPA)
          echo ========================================================
          kubectl get ingress,hpa,pdb -n banking-system
          exit /b 0

      - name: Smoke Check Kubernetes API Gateway (NodePort 30080)
        if: env.K8S_READY == 'true'
        shell: cmd
        continue-on-error: true
        run: |
          echo Probing API Gateway health on NodePort 30080...
          curl -s -f http://localhost:30080/healthz
          if errorlevel 1 (
            echo ::warning::NodePort 30080 /healthz did not respond immediately. Checking /readyz...
            curl -s -f http://localhost:30080/readyz
          ) else (
            echo.
            echo API Gateway is healthy and responding on NodePort 30080!
          )
          exit /b 0

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 9: Post-Deployment Smoke Verification
  # ═══════════════════════════════════════════════════════════════════════════
  post-deploy-smoke:
    name: Post-Deploy Smoke Verification
    needs: [deploy-compose, deploy-k8s]
    if: always() && (needs.deploy-compose.result == 'success' || needs.deploy-k8s.result == 'success')
    runs-on: [self-hosted, Windows]
    steps:
      - name: Verify Docker Compose API Gateway & Cluster Status (Port 8080)
        shell: cmd
        continue-on-error: true
        run: |
          echo Verifying Docker Compose cluster status after deployment...
          curl -s -f http://localhost:8080/api/v1/cluster/status
          if errorlevel 1 (
            echo ::warning::Docker Compose cluster status check returned error or runner cannot reach localhost:8080.
          ) else (
            echo.
            echo Docker Compose cluster is healthy and responding on http://localhost:8080!
          )

      - name: Verify Kubernetes API Gateway & Cluster Status (NodePort 30080)
        shell: cmd
        continue-on-error: true
        run: |
          echo Verifying Kubernetes cluster status on NodePort 30080...
          curl -s -f http://localhost:30080/api/v1/cluster/status
          if errorlevel 1 (
            echo ::warning::Kubernetes cluster status check returned error or runner cannot reach localhost:30080.
          ) else (
            echo.
            echo Kubernetes cluster is healthy and responding on http://localhost:30080!
          )
