# SonarQube / SonarCloud configuration for Global Wallet Microservices
sonar.projectKey=global-wallet
sonar.projectName=Global Wallet Microservices
sonar.projectVersion=1.0.0

# Source and test configuration
sonar.sources=cmd,pkg
sonar.tests=cmd,pkg
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*.pb.go,**/*_grpc.pb.go,proto/**,deploy/**,k8s/**,postman/**,docs/**,scripts/**

# Go test coverage
sonar.go.coverage.reportPaths=coverage.out
sonar.coverage.exclusions=**/*.pb.go,**/*_grpc.pb.go,proto/**,scripts/**,pkg/observability/lock_posix.go,pkg/observability/lock_windows.go,cmd/*/main.go

# Encoding
sonar.sourceEncoding=UTF-8
