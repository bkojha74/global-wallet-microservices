name: global-cache-tier

services:
  redis:
    image: redis:7-alpine
    container_name: wallet_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - wallet_redis_data:/data
    networks:
      wallet_shared_net:
        aliases:
          - redis

volumes:
  wallet_redis_data:

networks:
  wallet_shared_net:
    name: wallet_shared_net
    external: true
