## RabbitMQ configuration for global-wallet-microservices
## Phase 5: production hardening
##
## For local single-node development this file is not required.
## Mount it at /etc/rabbitmq/rabbitmq.conf when running in cluster mode.

# ─── Networking ───────────────────────────────────────────────────────────────
listeners.tcp.default = 5672

# TLS listener (uncomment and set paths when using Phase 5 TLS)
# listeners.ssl.default = 5671
# ssl_options.cacertfile = /etc/rabbitmq/tls/ca.crt
# ssl_options.certfile   = /etc/rabbitmq/tls/server.crt
# ssl_options.keyfile    = /etc/rabbitmq/tls/server.key
# ssl_options.verify     = verify_peer
# ssl_options.fail_if_no_peer_cert = true

# ─── Quorum Queue defaults (Phase 5) ─────────────────────────────────────────
# New queues created without an explicit x-queue-type default to quorum.
# Comment out to keep classic queues for local development.
default_queue_type = quorum

# ─── Cluster formation (HA / multi-node) ─────────────────────────────────────
# Uncomment the block below to enable peer discovery via a fixed list of nodes.
# Start nodes with the same RABBITMQ_ERLANG_COOKIE.

cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3

cluster_partition_handling = autoheal

# ─── Management plugin ────────────────────────────────────────────────────────
management.tcp.port = 15672
# management.load_definitions = /etc/rabbitmq/definitions.json

# ─── Logging ─────────────────────────────────────────────────────────────────
log.console = true
log.console.level = info
