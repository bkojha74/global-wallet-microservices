version: '3.8'

services:
  logging-service:
    build:
      context: .
    container_name: wallet_logging_service
    environment:
      - MONGO_URI=mongodb://wallet_mongodb:27017/?replicaSet=rs0
      - RABBITMQ_URL=amqp://guest:guest@wallet_rabbitmq:5672/
      - HTTP_PORT=8090
    ports:
      - "8090:8090"
      - "9090:9090"
    networks:
      - shared_net
    restart: unless-stopped

networks:
  shared_net:
    name: wallet_shared_net
    external: true
