services:
  ledger-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: ledger-service
    container_name: wallet_ledger_service
    restart: always
    environment:
      - PORT=50052
      - MONGO_URI=mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      - REGION_NAME=global-core
      - INSTANCE_ID=ledger-service-1
      - ENVIRONMENT=local
      - METRICS_PORT=9092
      - LOGGING_RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - LOGGING_SPOOL_PATH=data/logging/ledger-service.jsonl
    ports:
      - "50052:50052"
      - "9092:9092"
    networks:
      - banking_net

  wallet-primary:
    build:
      context: .
      dockerfile: Dockerfile
      target: wallet-service
    container_name: wallet_primary_active
    restart: always
    environment:
      - PORT=50051
      - MONGO_URI=mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      - LEDGER_SERVICE_ADDR=ledger-service:50052
      - REGION_NAME=us-east-1 (Primary Active)
      - IS_ACTIVE=true
      - COORDINATOR_ROLE=PRIMARY
      - METRICS_PORT=9094
      - INSTANCE_ID=wallet-primary
      - ENVIRONMENT=local
      - LOGGING_RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - LOGGING_SPOOL_PATH=data/logging/wallet-primary.jsonl
    ports:
      - "50051:50051"
      - "9094:9094"
    depends_on:
      - ledger-service
    networks:
      - banking_net

  wallet-standby:
    build:
      context: .
      dockerfile: Dockerfile
      target: wallet-service
    container_name: wallet_standby_hot_dr
    restart: always
    environment:
      - PORT=50053
      - MONGO_URI=mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      - LEDGER_SERVICE_ADDR=ledger-service:50052
      - REGION_NAME=eu-west-1 (Standby Hot DR)
      - IS_ACTIVE=false
      - COORDINATOR_ROLE=STANDBY
      - METRICS_PORT=9093
      - INSTANCE_ID=wallet-standby
      - ENVIRONMENT=local
      - LOGGING_RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - LOGGING_SPOOL_PATH=data/logging/wallet-standby.jsonl
    ports:
      - "50053:50053"
      - "9093:9093"
    depends_on:
      - ledger-service
    networks:
      - banking_net

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: wallet_keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
    volumes:
      - ./deploy/keycloak/wallet-realm-realm.json:/opt/keycloak/data/import/wallet-realm-realm.json:ro
    ports:
      - "8085:8080"
    networks:
      - banking_net

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: auth-service
    container_name: wallet_auth_service
    restart: always
    environment:
      - AUTH_SERVICE_PORT=50054
      - MONGO_URI=mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      - ENVIRONMENT=local
      - METRICS_PORT=9095
      - INSTANCE_ID=auth-service-1
      - LOGGING_RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - LOGGING_SPOOL_PATH=data/logging/auth-service.jsonl
      # Set AUTH_PRIVATE_KEY_PATH and AUTH_PUBLIC_KEY_PATH for RS256 (recommended for production)
      # - AUTH_PRIVATE_KEY_PATH=/app/certs/auth_private.pem
      # - AUTH_PUBLIC_KEY_PATH=/app/certs/auth_public.pem
      # For development: falls back to JWT_SECRET for HS256
      - JWT_SECRET=${JWT_SECRET:-development-wallet-insecure-secret-key-change-in-prod}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me-in-production}
      # Keycloak / External OIDC configuration:
      - AUTH_PROVIDER=${AUTH_PROVIDER:-hybrid}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-wallet-realm}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-wallet-api}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-wallet-client-secret-12345}
    ports:
      - "50054:50054"
      - "9095:9095"
    depends_on:
      - keycloak
    networks:
      - banking_net

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-gateway
    container_name: wallet_api_gateway
    restart: always
    environment:
      - HTTP_PORT=8080
      - MONGO_URI=mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      - PRIMARY_WALLET_ADDR=wallet-primary:50051
      - STANDBY_WALLET_ADDR=wallet-standby:50053
      - LEDGER_ADDR=ledger-service:50052
      - AUTH_SERVICE_ADDR=auth-service:50054
      - INSTANCE_ID=api-gateway-1
      - ENVIRONMENT=local
      - LOGGING_RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - LOGGING_SPOOL_PATH=data/logging/api-gateway.jsonl
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - wallet-primary
      - wallet-standby
      - ledger-service
    networks:
      - banking_net

networks:
  banking_net:
    name: wallet_shared_net
    external: true
