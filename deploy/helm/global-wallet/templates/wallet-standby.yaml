{{- if .Values.walletStandby.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-standby
  namespace: {{ include "global-wallet.namespace" . }}
  labels:
    app: wallet-service
    tier: standby
    {{- include "global-wallet.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.walletStandby.replicas }}
  selector:
    matchLabels:
      app: wallet-service
      tier: standby
  template:
    metadata:
      labels:
        app: wallet-service
        tier: standby
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: wallet-standby
          image: "{{ .Values.walletStandby.image.repository }}:{{ .Values.walletStandby.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 50053
              name: grpc
            - containerPort: 9093
              name: metrics
          env:
            - name: REGION
              valueFrom:
                configMapKeyRef:
                  name: wallet-config
                  key: STANDBY_REGION
            - name: IS_PRIMARY
              value: "false"
            - name: PORT
              value: "50053"
            - name: GRPC_PORT
              value: "50053"
            - name: METRICS_PORT
              value: "9093"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: wallet-config
                  key: LOG_LEVEL
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: wallet-config
                  key: ENVIRONMENT
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: wallet-config
                  key: MONGO_URI
            - name: RABBITMQ_URI
              valueFrom:
                configMapKeyRef:
                  name: wallet-config
                  key: RABBITMQ_URI
            - name: LEDGER_SERVICE_ADDR
              value: "ledger-service:50052"
            - name: FX_SERVICE_ADDR
              value: "fx-service:50055"
          resources:
            {{- toYaml .Values.walletStandby.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-standby-service
  namespace: {{ include "global-wallet.namespace" . }}
  labels:
    app: wallet-service
    tier: standby
    {{- include "global-wallet.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.walletStandby.service.grpcPort }}
      targetPort: 50053
      name: grpc
    - port: {{ .Values.walletStandby.service.metricsPort }}
      targetPort: 9093
      name: metrics
  selector:
    app: wallet-service
    tier: standby
{{- end }}
