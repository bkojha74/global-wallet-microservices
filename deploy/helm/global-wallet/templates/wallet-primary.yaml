{{- if .Values.walletPrimary.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-primary
  namespace: {{ include "global-wallet.namespace" . }}
  labels:
    app: wallet-service
    tier: primary
    {{- include "global-wallet.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.walletPrimary.replicas }}
  selector:
    matchLabels:
      app: wallet-service
      tier: primary
  template:
    metadata:
      labels:
        app: wallet-service
        tier: primary
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: wallet-primary
          image: "{{ .Values.walletPrimary.image.repository }}:{{ .Values.walletPrimary.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 9094
              name: metrics
          env:
            - name: REGION
              valueFrom:
                configMapKeyRef:
                  name: wallet-config
                  key: PRIMARY_REGION
            - name: IS_PRIMARY
              value: "true"
            - name: PORT
              value: "50051"
            - name: GRPC_PORT
              value: "50051"
            - name: METRICS_PORT
              value: "9094"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: wallet-config
                  key: LOG_LEVEL
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: wallet-config
                  key: ENVIRONMENT
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: wallet-config
                  key: MONGO_URI
            - name: RABBITMQ_URI
              valueFrom:
                configMapKeyRef:
                  name: wallet-config
                  key: RABBITMQ_URI
            - name: LEDGER_SERVICE_ADDR
              value: "ledger-service:50052"
            - name: FX_SERVICE_ADDR
              value: "fx-service:50055"
          resources:
            {{- toYaml .Values.walletPrimary.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-primary-service
  namespace: {{ include "global-wallet.namespace" . }}
  labels:
    app: wallet-service
    tier: primary
    {{- include "global-wallet.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.walletPrimary.service.grpcPort }}
      targetPort: 50051
      name: grpc
    - port: {{ .Values.walletPrimary.service.metricsPort }}
      targetPort: 9094
      name: metrics
  selector:
    app: wallet-service
    tier: primary
{{- end }}
