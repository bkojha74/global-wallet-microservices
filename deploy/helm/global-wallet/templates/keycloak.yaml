{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: {{ include "global-wallet.namespace" . }}
  labels:
    app.kubernetes.io/name: keycloak-realm-config
    {{- include "global-wallet.labels" . | nindent 4 }}
data:
  wallet-realm-realm.json: |
    {
      "realm": "wallet-realm",
      "enabled": true,
      "displayName": "Global Wallet Platform",
      "accessTokenLifespan": 900,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 36000,
      "roles": {
        "realm": [
          { "name": "admin", "description": "Platform administrator with full cluster access" },
          { "name": "user", "description": "Standard wallet account holder" },
          { "name": "auditor", "description": "Compliance and ledger auditor" }
        ]
      },
      "clientScopes": [
        {
          "name": "wallet:read",
          "description": "Read wallet balances and transaction history",
          "protocol": "openid-connect",
          "attributes": { "include.in.token.scope": "true", "display.on.consent.screen": "true" }
        },
        {
          "name": "wallet:transfer",
          "description": "Initiate funds transfers between wallets",
          "protocol": "openid-connect",
          "attributes": { "include.in.token.scope": "true", "display.on.consent.screen": "true" }
        },
        {
          "name": "cluster:admin",
          "description": "Trigger cluster failover and administrative operations",
          "protocol": "openid-connect",
          "attributes": { "include.in.token.scope": "true", "display.on.consent.screen": "true" }
        },
        {
          "name": "ledger:audit",
          "description": "Access immutable ledger audit trails",
          "protocol": "openid-connect",
          "attributes": { "include.in.token.scope": "true", "display.on.consent.screen": "true" }
        }
      ],
      "clients": [
        {
          "clientId": "wallet-api",
          "name": "Global Wallet API Gateway & Auth Service",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "secret": "wallet-client-secret-12345",
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": true,
          "publicClient": false,
          "protocol": "openid-connect"
        }
      ],
      "users": [
        {
          "username": "admin",
          "enabled": true,
          "email": "admin@wallet.local",
          "credentials": [{ "type": "password", "value": "admin123", "temporary": false }],
          "realmRoles": ["admin"]
        },
        {
          "username": "alice",
          "enabled": true,
          "email": "alice@wallet.local",
          "credentials": [{ "type": "password", "value": "alice123", "temporary": false }],
          "realmRoles": ["user"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ include "global-wallet.namespace" . }}
  labels:
    app: keycloak
    {{- include "global-wallet.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.keycloak.replicas }}
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: ADMIN_USERNAME
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: ADMIN_PASSWORD
            - name: KC_HEALTH_ENABLED
              value: "true"
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import/wallet-realm-realm.json
              subPath: wallet-realm-realm.json
              readOnly: true
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ include "global-wallet.namespace" . }}
  labels:
    app: keycloak
    {{- include "global-wallet.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.keycloak.service.port }}
      targetPort: {{ .Values.keycloak.service.targetPort }}
      name: http
  selector:
    app: keycloak
{{- end }}
