{{- if .Values.apiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ include "global-wallet.namespace" . }}
  labels:
    app: api-gateway
    {{- include "global-wallet.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api-gateway
          image: "{{ .Values.apiGateway.image.repository }}:{{ .Values.apiGateway.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: metrics
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: METRICS_PORT
              value: "8081"
            - name: PRIMARY_WALLET_ADDR
              value: "wallet-primary-service:50051"
            - name: STANDBY_WALLET_ADDR
              value: "wallet-standby-service:50053"
            - name: WALLET_PRIMARY_ADDR
              value: "wallet-primary-service:50051"
            - name: WALLET_STANDBY_ADDR
              value: "wallet-standby-service:50053"
            - name: LEDGER_ADDR
              value: "ledger-service:50052"
            - name: LEDGER_SERVICE_ADDR
              value: "ledger-service:50052"
            - name: LOGGING_SERVICE_ADDR
              value: "http://logging-service:8090"
            - name: AUTH_SERVICE_ADDR
              value: "auth-service:50054"
            - name: FX_SERVICE_ADDR
              value: "fx-service:50055"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: wallet-config
                  key: LOG_LEVEL
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: wallet-config
                  key: ENVIRONMENT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: JWT_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: GEMINI_API_KEY
            - name: GEMINI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: wallet-config
                  key: GEMINI_MODEL
            - name: GEMINI_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: wallet-config
                  key: GEMINI_TIMEOUT_MS
            - name: GEMINI_FAIL_OPEN
              valueFrom:
                configMapKeyRef:
                  name: wallet-config
                  key: GEMINI_FAIL_OPEN
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ include "global-wallet.namespace" . }}
  labels:
    app: api-gateway
    {{- include "global-wallet.labels" . | nindent 4 }}
spec:
  type: {{ .Values.apiGateway.service.type }}
  ports:
    - port: {{ .Values.apiGateway.service.httpPort }}
      targetPort: 8080
      {{- if eq .Values.apiGateway.service.type "NodePort" }}
      nodePort: {{ .Values.apiGateway.service.nodePort }}
      {{- end }}
      name: http
    - port: {{ .Values.apiGateway.service.metricsPort }}
      targetPort: 8081
      {{- if eq .Values.apiGateway.service.type "NodePort" }}
      nodePort: {{ .Values.apiGateway.service.metricsNodePort }}
      {{- end }}
      name: metrics
  selector:
    app: api-gateway
{{- end }}
