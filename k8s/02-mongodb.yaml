apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: banking-system
  labels:
    app: mongodb
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: 27017
      name: mongo
  selector:
    app: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: banking-system
spec:
  serviceName: mongodb-service
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongo
          image: mongo:7.0
          command:
            - mongod
            - "--replSet"
            - "rs0"
            - "--bind_ip_all"
          ports:
            - containerPort: 27017
              name: mongo
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - mongosh
                - "--quiet"
                - "--eval"
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - mongosh
                - "--quiet"
                - "--eval"
                - "rs.status().ok"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
        # Auto-initiate sidecar on node 0
        - name: mongo-init-replica
          image: mongo:7.0
          command:
            - "bash"
            - "-c"
            - |
              if [[ $(hostname) != "mongodb-0" ]]; then
                echo "Not primary candidate node. Skipping replica set initiation.";
                exit 0;
              fi
              echo "Waiting for local mongod to be responsive...";
              until mongosh --eval "db.adminCommand('ping')" >/dev/null 2>&1; do
                sleep 2;
              done;
              echo "Initiating replica set rs0...";
              mongosh --quiet --eval '
                try {
                  rs.status();
                  print("Replica set already initialized.");
                } catch (e) {
                  rs.initiate({
                    _id: "rs0",
                    members: [
                      { _id: 0, host: "mongodb-0.mongodb-service.banking-system.svc.cluster.local:27017" }
                    ]
                  });
                  print("Replica set rs0 initialized successfully.");
                }
              ';
              echo "Replica set initialization complete. Sleeping indefinitely...";
              exec sleep infinity;
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
