apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: banking-system
  labels:
    app.kubernetes.io/name: keycloak-realm-config
data:
  wallet-realm-realm.json: |
    {
      "realm": "wallet-realm",
      "enabled": true,
      "displayName": "Global Wallet Platform",
      "accessTokenLifespan": 900,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 36000,
      "roles": {
        "realm": [
          { "name": "admin", "description": "Platform administrator with full cluster access" },
          { "name": "user", "description": "Standard wallet account holder" },
          { "name": "auditor", "description": "Compliance and ledger auditor" }
        ]
      },
      "clientScopes": [
        {
          "name": "wallet:read",
          "description": "Read wallet balances and transaction history",
          "protocol": "openid-connect",
          "attributes": { "include.in.token.scope": "true", "display.on.consent.screen": "true" }
        },
        {
          "name": "wallet:transfer",
          "description": "Initiate funds transfers between wallets",
          "protocol": "openid-connect",
          "attributes": { "include.in.token.scope": "true", "display.on.consent.screen": "true" }
        },
        {
          "name": "cluster:admin",
          "description": "Trigger cluster failover and administrative operations",
          "protocol": "openid-connect",
          "attributes": { "include.in.token.scope": "true", "display.on.consent.screen": "true" }
        },
        {
          "name": "ledger:audit",
          "description": "Access immutable ledger audit trails",
          "protocol": "openid-connect",
          "attributes": { "include.in.token.scope": "true", "display.on.consent.screen": "true" }
        }
      ],
      "clients": [
        {
          "clientId": "wallet-api",
          "name": "Global Wallet API Gateway & Auth Service",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "secret": "wallet-client-secret-12345",
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": true,
          "publicClient": false,
          "protocol": "openid-connect"
        }
      ],
      "users": [
        {
          "username": "admin",
          "enabled": true,
          "email": "admin@wallet.local",
          "credentials": [{ "type": "password", "value": "admin123", "temporary": false }],
          "realmRoles": ["admin"]
        },
        {
          "username": "alice",
          "enabled": true,
          "email": "alice@wallet.local",
          "credentials": [{ "type": "password", "value": "alice123", "temporary": false }],
          "realmRoles": ["user"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: banking-system
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:latest
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: ADMIN_USERNAME
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: ADMIN_PASSWORD
            - name: KC_HEALTH_ENABLED
              value: "true"
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import/wallet-realm-realm.json
              subPath: wallet-realm-realm.json
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: banking-system
  labels:
    app: keycloak
spec:
  type: ClusterIP
  ports:
    - port: 8085
      targetPort: 8080
      name: http
  selector:
    app: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: banking-system
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 20
      containers:
        - name: auth-service
          image: wallet-system/auth-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 50054
              name: grpc
            - containerPort: 9095
              name: metrics
          envFrom:
            - configMapRef:
                name: wallet-config
          env:
            - name: AUTH_SERVICE_PORT
              value: "50054"
            - name: METRICS_PORT
              value: "9095"
            - name: ENVIRONMENT
              value: "production"
            - name: AUTH_PROVIDER
              value: "hybrid"
            - name: KEYCLOAK_URL
              value: "http://keycloak:8085"
            - name: KEYCLOAK_REALM
              value: "wallet-realm"
            - name: KEYCLOAK_CLIENT_ID
              value: "wallet-api"
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: KEYCLOAK_CLIENT_SECRET
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: JWT_SECRET
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: ADMIN_PASSWORD
            - name: LOGGING_RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 50054
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: 50054
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: banking-system
  labels:
    app: auth-service
spec:
  type: ClusterIP
  ports:
    - port: 50054
      targetPort: 50054
      name: grpc
    - port: 9095
      targetPort: 9095
      name: metrics
  selector:
    app: auth-service
