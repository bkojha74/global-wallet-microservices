apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-config
  namespace: banking-system
  labels:
    app.kubernetes.io/name: wallet-config
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  RATE_LIMIT_RPS: "60"
  RATE_LIMIT_BURST: "100"
  LOGGING_QUEUE_TYPE: "quorum"
  LOGGING_RETENTION_DAYS: "90"
  LOGGING_RETENTION_INTERVAL_HOURS: "24"
  AUTH_PROVIDER: "hybrid"
  KEYCLOAK_REALM: "wallet-realm"
  KEYCLOAK_CLIENT_ID: "wallet-api"
  FX_DEFAULT_SPREAD_BPS: "15"
  FX_SYNC_INTERVAL_SEC: "300"
---
apiVersion: v1
kind: Secret
metadata:
  name: wallet-secrets
  namespace: banking-system
  labels:
    app.kubernetes.io/name: wallet-secrets
type: Opaque
stringData:
  # Base configuration secrets; replace with production secrets manager or sealed secrets
  JWT_SECRET: "production-grade-256bit-secret-key-change-in-production"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "production-strong-admin-password-change-me"
  KEYCLOAK_CLIENT_SECRET: "wallet-client-secret-12345"
  MONGO_URI: "mongodb://mongodb-0.mongodb-service.banking-system.svc.cluster.local:27017,mongodb-1.mongodb-service.banking-system.svc.cluster.local:27017,mongodb-2.mongodb-service.banking-system.svc.cluster.local:27017/?replicaSet=rs0&readPreference=primaryPreferred"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq-service.banking-system.svc.cluster.local:5672/"
