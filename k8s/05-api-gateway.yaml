apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: banking-system
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 20
      containers:
        - name: api-gateway
          image: wallet-system/api-gateway:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: metrics
          envFrom:
            - configMapRef:
                name: wallet-config
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: METRICS_PORT
              value: "8081"
            - name: PRIMARY_WALLET_ADDR
              value: "wallet-primary-service:50051"
            - name: STANDBY_WALLET_ADDR
              value: "wallet-standby-service:50053"
            - name: LEDGER_ADDR
              value: "ledger-service:50052"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: JWT_SECRET
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: MONGO_URI
            - name: LOGGING_RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: banking-system
  labels:
    app: api-gateway
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
    - port: 8081
      targetPort: 8081
      name: metrics
  selector:
    app: api-gateway
