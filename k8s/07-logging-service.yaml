apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-service
  namespace: banking-system
  labels:
    app: logging-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logging-service
  template:
    metadata:
      labels:
        app: logging-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 20
      containers:
        - name: logging-service
          image: wallet-system/logging-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8090
              name: http
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: wallet-config
          env:
            - name: HTTP_PORT
              value: "8090"
            - name: METRICS_PORT
              value: "9090"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: MONGO_URI
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: logging-service
  namespace: banking-system
  labels:
    app: logging-service
spec:
  type: ClusterIP
  ports:
    - port: 8090
      targetPort: 8090
      name: http
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app: logging-service
