              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9093
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-standby-service
  namespace: banking-system
  labels:
    app: wallet-service
    tier: standby
spec:
  type: ClusterIP
  ports:
    - port: 50053
      targetPort: 50053
      name: grpc
    - port: 9093
      targetPort: 9093
      name: metrics
  selector:
    app: wallet-service
    tier: standby
