name: wallet-rabbitmq

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: wallet_rabbitmq
    hostname: rabbitmq-1
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
      # TLS AMQP port — uncomment when Phase 5 TLS is enabled:
      # - "5671:5671"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      # HA: set a shared cookie so all cluster nodes trust each other
      - RABBITMQ_ERLANG_COOKIE=wallet_erlang_secret_change_me
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # Phase 5: mount production config and enabled plugins list
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./config/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      # TLS certs — uncomment when Phase 5 TLS is enabled:
      # - ./config/rabbitmq/tls:/etc/rabbitmq/tls:ro
    networks:
      - wallet_shared_net

# ─── Phase 5: 3-node HA cluster (production) ─────────────────────────────────
# Uncomment this block and the rabbitmq-2 / rabbitmq-3 services to run a
# production-grade quorum-queue cluster.  Scale down to 1 node for local dev.

  rabbitmq-2:
    image: rabbitmq:3.13-management
    container_name: wallet_rabbitmq_2
    hostname: rabbitmq-2
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_ERLANG_COOKIE=wallet_erlang_secret_change_me
      - RABBITMQ_NODE_TYPE=disc
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./config/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - wallet_shared_net

  rabbitmq-3:
    image: rabbitmq:3.13-management
    container_name: wallet_rabbitmq_3
    hostname: rabbitmq-3
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_ERLANG_COOKIE=wallet_erlang_secret_change_me
      - RABBITMQ_NODE_TYPE=disc
    volumes:
      - rabbitmq_data_3:/var/lib/rabbitmq
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./config/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - wallet_shared_net

volumes:
  rabbitmq_data:
    name: wallet_rabbitmq_data
  # HA volumes (uncomment with cluster nodes above):
  rabbitmq_data_2:
    name: wallet_rabbitmq_data_2
  rabbitmq_data_3:
    name: wallet_rabbitmq_data_3

networks:
  wallet_shared_net:
    name: wallet_shared_net
    external: true
