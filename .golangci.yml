version: "2"

run:
  timeout: 5m
  concurrency: 4
  tests: false

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
  settings:
    govet:
      enable-all: false
    staticcheck:
      checks:
        - "all"
        - "-ST1005"
        - "-QF1003"

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - staticcheck
        - unused
